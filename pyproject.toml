[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kgnite"
version = "0.1.0"
description = "Unified Kaggle CLI helper built on top of kaggle and kagglehub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "kagglehub>=1.0.0",
  # 0.1.32 imports a competitions.legacy package omitted from its wheel.
  "kagglesdk>=0.1.22,!=0.1.32,<1.0",
]

[project.scripts]
kgnite = "kgnite.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
